[project]
name = "autocomplete-service"
version = "0.10.0"
description = "Sprint-10 autocomplete + snippet expansion service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.29.0",
    "redis>=5.0",
    "marisa-trie>=1.1.0",
    # Eval scoring calls asr-service over HTTP (migration 0091).
    "httpx>=0.27.0",
    "rapidfuzz>=3.6",
    # Corpus-v3 Epic A: the normalisation rules are a versioned YAML file
    # in the repo (data/eval_normalization_v2.yaml), reviewed like code.
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "python-json-logger>=2.0.7",
    "observability",
    "auth",
    "audit",
    "db",
    "secret",
    # Sprint 16: telemetry cold-archive writes through EncryptedObjectStore.
    "crypto",
    "storage",
    # Authored candidates submitted from the console are risk-flagged and
    # tier-routed with the SAME code corpus-forge runs on mined/generated
    # ones — a second implementation would mean a dose phrase reaching a
    # different tier depending on which door it came through.
    "corpus-risk",
]

[tool.uv.sources]
observability = { workspace = true }
auth = { workspace = true }
audit = { workspace = true }
db = { workspace = true }
secret = { workspace = true }
crypto = { workspace = true }
storage = { workspace = true }
corpus-risk = { workspace = true }

[project.optional-dependencies]
# Corpus-v3 Epic F: the data register's PDF export. Same shape as
# medical_kep[pdf] — weasyprint needs pango/cairo at runtime, so it is an
# extra and the import is lazy. Without it /compliance/data-register/
# export.pdf answers 503 and points at the HTML export, which always works.
pdf = [
    "weasyprint>=62.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fakeredis>=2.23",
    "hypothesis>=6.103",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocomplete_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
