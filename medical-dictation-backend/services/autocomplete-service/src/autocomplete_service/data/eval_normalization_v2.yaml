# Normalisation rules for WER scoring — corpus-v3 Epic A.
#
# DATA, NOT CODE. Adding a unit alias or a numeral case form must not require a
# release, and the diff of a rules change has to be readable by the linguist who
# asked for it. That is why this is YAML in the repository rather than a table
# in the database: versioned by git, reviewed like code, and hashed.
#
# THE VERSION IS LOAD-BEARING. `version` travels onto every eval run row and
# /corpus/eval/compare refuses two runs that disagree about it — a rules change
# silently makes new numbers incomparable with old ones. Change the rules,
# change the version; RULES_SHA256 is the proof behind that promise.
#
# WHAT v2 ADDS OVER v1 — the defects the v2 measurement surfaced:
#   · rate denominators. "68/хв" and "68 за хвилину" now land on the same
#     tokens. v1 dropped the slash but kept the preposition, which is why
#     uk-cardiology-a001 scored 50% WER on a pulse the model heard correctly.
#   · micro-sign and percent-case aliases (µg/μg, відсотках/відсотку).
#   · the `spoken` tables — the REVERSE direction (digits → words) the gold
#     linter uses to propose "пульс шістдесят вісім за хвилину" for a gold
#     written "пульс 68/хв".
#
# The forward direction stays deliberately conservative: no stemming, no
# lemmatisation, no case-ending stripping. "інфаркту" vs "інфаркт" is a real
# recognition error and must keep counting as one.

version: v2
description: 'WER normalisation rules, corpus-v3 Epic A. Data, not code: adding a unit alias or a numeral
  case form must not require a release. The version string is stored on every run; a rules change makes
  new numbers incomparable with old ones, and that has to be visible. v2 adds inverse text normalisation
  for mixed formats: rate denominators, micro-sign aliases, more percent cases, and the `spoken` tables
  that drive the reverse direction used by the gold-transcript linter.'
