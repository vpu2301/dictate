# ── reverse direction: digits → spoken form ───────────────────────────────
#
# Drives the gold-transcript linter (Epic B), which proposes the spoken
# rewrite of a gold written in digits. It is a SUGGESTION a human accepts or
# edits: Ukrainian numeral–noun agreement has more cases than a table can
# settle, so these encode the four forms that cover clinical dictation and
# stop there.
#
# one/few/many follow the Slavic plural rule on the trailing digits — 1 but
# not 11 → one, 2–4 but not 12–14 → few, otherwise many. `frac` is the form
# after a decimal ("сім цілих дві десятих ВІДСОТКА"). `rate` is the form
# after a slash denominator ("68/хв" → "68 ЗА ХВИЛИНУ").
spoken:
  uk:
    connector: "на"
    zero: "нуль"
    ones:
      m: ["", "один", "два", "три", "чотири", "п'ять", "шість", "сім", "вісім", "дев'ять"]
      f: ["", "одна", "дві", "три", "чотири", "п'ять", "шість", "сім", "вісім", "дев'ять"]
