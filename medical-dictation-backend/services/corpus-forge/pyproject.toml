[project]
name = "corpus-forge"
version = "0.1.0"
description = "Clinical corpus pipeline CLI — mine, import, generate, review, promote, release (sprint 21, ADR-0043/0044)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.6.0",
    "pyyaml>=6.0",
    "db",
    "audit",
    "secret",
    # The risk flagger + tier router: shared with autocomplete-service so the
    # CLI and the console's POST /corpus/candidates route phrases identically.
    "corpus-risk",
]

[tool.uv.sources]
db = { workspace = true }
audit = { workspace = true }
secret = { workspace = true }
corpus-risk = { workspace = true }

[project.scripts]
corpus-forge = "corpus_forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
