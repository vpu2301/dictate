[project]
name = "marketing-service"
version = "0.1.0"
description = "Public demo-booking funnel — request acknowledgement and booking confirmation email"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Backs pydantic's EmailStr. The demo endpoint is unauthenticated and
    # its only required field is an address, so validating it properly is
    # the whole input-validation story for that route.
    "email-validator>=2.1.0",
    "asyncpg>=0.29.0",
    "jinja2>=3.1.4",
    "aiosmtplib>=3.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "python-json-logger>=2.0.7",
    "observability",
    "db",
    "secret",
]

[tool.uv.sources]
observability = { workspace = true }
db = { workspace = true }
secret = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
