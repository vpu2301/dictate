# ══════════════════════════════════════════════════════════════════
# Full-stack overlay — auto-merged with docker-compose.yml on a plain
# `docker compose up`, so `docker compose build && docker compose up`
# brings up the ENTIRE backend: infra (from docker-compose.yml) + DB
# migrate/seed one-shots + all application services.
#
#   docker compose build      # builds every service image
#   docker compose up         # infra → migrate → seed → services
#
# `make dev-up` uses `-f docker-compose.yml` explicitly, which disables
# auto-loading of this override, so it stays infra-only (unchanged).
#
# Services (host → container :8000):
#   auth-service          :8000   (the SPA expects this origin)
#   asr-service           :8001
#   dictation-service     :8002   (WebSocket streaming ASR)
#   core-service          :8003   (patients & per-patient record)
#   notification-service  :8004   (feed + WebSocket push + email)
#   nlp-service           :8005
#   report-service        :8006
#   autocomplete-service  :8007
#   signing-service       :8008
#   generation-service    :8009   (S15 Layer C inline completion)
#   marketing-service     :8012   (public demo booking funnel — no auth;
#                                  8010/8011/8013-8015 belong to evidence-backend)
#   llama-server          :8089   (S15 inference backend — mounts the
#                                  host's `ollama pull gemma3:1b` blob)
#   asr-worker            (no port — Redis-stream consumer)
#
# NOTE: building asr-worker + dictation-service downloads the pinned
# faster-whisper-tiny weights from Hugging Face at BUILD time (offline
# at runtime). The first `docker compose build` therefore needs network.
#
# MEMORY FLOOR — 12 GiB of Docker engine memory, and this is a hard
# requirement, not a recommendation. Measured resident on this stack:
#   asr-worker          2.7 GiB  (whisper large-v3, int8, CPU)
#   dictation-service   3.0 GiB  (whisper large-v3 + ECAPA diarizer)
#   everything else     ~2.0 GiB (keycloak, nlp, postgres, kafka, obs)
# Two large-v3 instances is what moving streaming off tiny cost us (see
# the dictation-service block below); on Docker Desktop's 8 GiB default
# the loser is dictation-service, which OOMs while loading the diarizer
# and is restarted by `restart: unless-stopped` — a silent crash-loop
# whose only symptom at the SPA is a WebSocket that will not open
# (conversation mode reports `connect_failed`). Diagnose with
#   docker events --filter container=medical-dictation-dictation-service-1
# and look for `oom` / `die exit=137`, then raise Docker Desktop →
# Settings → Resources → Memory. `docker info --format '{{.MemTotal}}'`
# reports what the engine actually has.
# ══════════════════════════════════════════════════════════════════
name: medical-dictation

# ── Shared snippets ────────────────────────────────────────────────
x-postgres-dsns: &postgres-dsns
  DB_APP_ROLE_DSN: postgresql://app_role:app_role@postgres:5432/medical_dictation
  DB_AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer@postgres:5432/medical_dictation

x-auth-env: &auth-env
  AUTH_ISSUER: http://keycloak:8080/realms/medical-dictation
  AUTH_JWKS_URL: http://keycloak:8080/realms/medical-dictation/protocol/openid-connect/certs

# Browser origins allowed to call the SPA-facing services WITH credentials
# (the HttpOnly mdx_rt cookie). Single source of truth — every HTTP service that
# the SPA calls merges this so the CORS allow-list can't drift between services.
x-cors-env: &cors-env
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,https://vpu2301.github.io

x-common-env: &common-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-svc-healthcheck: &svc-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else sys.exit(1)"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  # ── MinIO bucket bootstrap (root compose only ships MinIO itself) ──
  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing local/mdx-audio
        mc mb --ignore-existing local/mdx-transcripts
        mc mb --ignore-existing local/mdx-dsar
        # 0065 — patient record attachments (referrals, lab PDFs, scans).
        mc mb --ignore-existing local/mdx-patient-docs
        mc mb --ignore-existing local/mdx-backups
        mc version enable local/mdx-audio || true
        mc version enable local/mdx-transcripts || true
        mc version enable local/mdx-patient-docs || true
        # S11 deployment (ADR-0028): DSAR packages expire at 7 days —
        # the object-storage backstop under the app-side TTL cron; DB
        # backups expire at 35 days — the erasure completion horizon
        # (docs/runbooks/erasure.md). Idempotent: rm any prior rule
        # for a clean re-add on every up.
        mc ilm rule rm --all --force local/mdx-dsar 2>/dev/null || true
        mc ilm rule add --expire-days 7 local/mdx-dsar
        mc ilm rule rm --all --force local/mdx-backups 2>/dev/null || true
        mc ilm rule add --expire-days 35 local/mdx-backups
        # S15 (ADR-0037): replay clips — 5-min token/registry TTL is the
        # real lifetime; 1-day ILM is the ciphertext backstop.
        mc mb --ignore-existing local/mdx-audio-clips
        mc ilm rule rm --all --force local/mdx-audio-clips 2>/dev/null || true
        mc ilm rule add --expire-days 1 local/mdx-audio-clips
        echo "minio-init: buckets ready"
    restart: "no"

  # ── DB schema migrations (one-shot, runs as the postgres superuser
  #    because migrations CREATE ROLE / extensions) ──────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medical_dictation
    command: ["python", "scripts/db/migrate.py", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Dev data seed (one-shot, after migrate). Also grants LOGIN to the
  #    signing-service's low-privilege roles (dev_role_logins.sql). ───
  seed:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medical_dictation
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_dictation
    command:
      - /bin/sh
      - -ec
      - |
        echo "seed: granting dev role logins"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/seed/dev_role_logins.sql
        echo "seed: dev tenants/users (seed.sql)"
        python scripts/seed/seed.py
        echo "seed: medical_prompts"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/seed/medical_prompts.sql
        echo "seed: global abbreviations"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/seed/abbreviations_global.sql
        echo "seed: voice commands"
        python scripts/seed/seed_voice_commands.py --dsn "$$DATABASE_URL"
        echo "seed: system templates (16)"
        python scripts/seed/seed_templates.py --dsn "$$DATABASE_URL"
        echo "seed: complete"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ── auth-service — identity, tenant CRUD, audit read (SPA :8000) ───
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *cors-env]
      DB_APP_ROLE_DSN: postgresql://app_role:app_role@postgres:5432/medical_dictation
      DB_TENANT_WRITER_DSN: postgresql://tenant_writer:tenant_writer@postgres:5432/medical_dictation
      DB_AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer@postgres:5432/medical_dictation
      DB_AUDIT_READER_DSN: postgresql://audit_reader:audit_reader@postgres:5432/medical_dictation
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: medical-dictation
      # ── Password recovery ────────────────────────────────────────
      # ON in the dev stack so the flow is exercised locally, with mail
      # captured by Mailpit (http://localhost:8025) rather than sent.
      # Every value below is `${VAR:-<mailpit default>}`, so with no
      # `.env` present nothing can escape to a real mailbox.
      MDX_PASSWORD_RESET_ENABLED: "${MDX_PASSWORD_RESET_ENABLED:-true}"
      MDX_EMAIL_PROVIDER: "${MDX_EMAIL_PROVIDER:-smtp}"
      MDX_AUTH_SMTP_HOST: "${MDX_AUTH_SMTP_HOST:-mailpit}"
      MDX_AUTH_SMTP_PORT: "${MDX_AUTH_SMTP_PORT:-1025}"
      MDX_AUTH_SMTP_USE_TLS: "${MDX_AUTH_SMTP_USE_TLS:-false}"
      MDX_AUTH_SMTP_USERNAME: "${MDX_AUTH_SMTP_USERNAME:-}"
      MDX_AUTH_SMTP_PASSWORD: "${MDX_AUTH_SMTP_PASSWORD:-}"
      MDX_AUTH_EMAIL_FROM: "${MDX_AUTH_EMAIL_FROM:-sales@klarnote.com}"
      MDX_AUTH_EMAIL_FROM_NAME: "${MDX_AUTH_EMAIL_FROM_NAME:-Klarnote}"
      MDX_AUTH_EMAIL_REPLY_TO: "${MDX_AUTH_EMAIL_REPLY_TO:-sales@klarnote.com}"
      # Where the mailed links point. Must be the origin the SPA is
      # actually served from, or every reset link 404s.
      MDX_APP_BASE_URL: "${MDX_APP_BASE_URL:-http://localhost:5173}"
      MDX_SUPPORT_URL: "${MDX_SUPPORT_URL:-https://klarnote.com/contact}"
      # Per-deployment salt for the stored IP hashes. The dev default is
      # a known string on purpose — it is not a secret here, and it MUST
      # be overridden in staging/prod.
      MDX_PASSWORD_RESET_IP_HASH_SALT: "${MDX_PASSWORD_RESET_IP_HASH_SALT:-dev-ip-hash-salt-change-in-prod}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── asr-service — batch ASR submission/status API ─────────────────
  asr-service:
    build:
      context: .
      dockerfile: services/asr-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/medical_dictation
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MD_ASR_NLP_BASE_URL: http://nlp-service:8000
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── asr-worker — batch Whisper inference (Redis-stream consumer) ──
  # Runs large-v3 (the production model) on CPU/int8 for real transcript
  # quality — tiny is unusable for Ukrainian clinical speech. The weights
  # come from the host's HF cache (same pinned revision as PINS.md, the
  # model.bin blob name IS the pinned sha256) mounted read-only, so the
  # baked tiny image stays untouched and nothing downloads at runtime.
  # CPU large-v3 runs slower than the default 5× realtime inference
  # budget — the multiplier is raised accordingly (dev only).
  asr-worker:
    build:
      context: .
      dockerfile: services/asr-worker/Dockerfile.cpu
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-dsns]
      MD_ASR_DEVICE: cpu
      MD_ASR_MODEL: /opt/models/whisper-large-v3/snapshots/edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_COMPUTE_TYPE: int8
      MD_ASR_MODEL_REPO: Systran/faster-whisper-large-v3
      MD_ASR_MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_MODEL_SHA256: 69f74147e3334731bc3a76048724833325d2ec74642fb52620eda87352e3d4f1
      MD_ASR_MAX_INFERENCE_SECONDS_MULTIPLIER: "40.0"
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/medical_dictation
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ${HOME}/.cache/huggingface/hub/models--Systran--faster-whisper-large-v3:/opt/models/whisper-large-v3:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── dictation-service — real-time streaming ASR over WebSocket ────
  # Runs large-v3, for the same reason asr-worker does: tiny does not
  # merely transcribe Ukrainian badly, it invents words that do not exist
  # in the language. Measured on eval/conversations/v1/uk-consult-001,
  # tiny/int8 returned "Добро губня, лікарию, в житті жди ні бомсь" where
  # large-v3/int8 returned "Доброго дня, лікарю, вже тиждень болі" — which
  # is exactly the "builds words that make no sense" report from the
  # conversation/scribe surface. Batch ASR was moved off tiny earlier;
  # streaming was left behind, so scribe was the one surface still on it.
  #
  # Weights come from the host's HF cache (the same pinned revision as
  # PINS.md and asr-worker, the model.bin blob name IS the pinned sha256)
  # mounted read-only, so the baked tiny image stays untouched and nothing
  # downloads at runtime.
  dictation-service:
    build:
      context: .
      dockerfile: services/dictation-service/Dockerfile.cpu
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      MD_ASR_DEVICE: cpu
      MD_ASR_MODEL: /opt/models/whisper-large-v3/snapshots/edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_COMPUTE_TYPE: int8
      MD_ASR_MODEL_REPO: Systran/faster-whisper-large-v3
      MD_ASR_MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
      MD_ASR_MODEL_SHA256: 69f74147e3334731bc3a76048724833325d2ec74642fb52620eda87352e3d4f1
      # Whisper's encoder always pads its input to 30 s, so a window costs
      # roughly the same whether it holds 3.5 s of audio or 30 s. Measured
      # (large-v3/int8, this CPU): 3.5 s window = 14.2 s compute = 0.25x
      # realtime, i.e. hopelessly behind; 30 s window = ~23.5 s compute.
      # With a 28 s hop that sustains 1.18x realtime over a 193 s
      # conversation, so the transcript keeps up and stays complete.
      #
      # The trade is partial latency: a word can take up to the hop to
      # appear. That is the honest cost of accurate Ukrainian on CPU and it
      # is acceptable for scribe (the note is written after the visit).
      # The GPU overlay (infra/compose/gpu.yml) keeps the low-latency
      # sprint-04 defaults — do NOT copy these values onto a GPU worker.
      MDX_WINDOW_SECONDS: "30.0"
      MDX_WINDOW_MIN_FOR_PARTIAL_SECONDS: "28.0"
      # Greedy decoding, and this one decides whether the worker keeps up.
      # Measured on a 28 s window of uk-consult-001: beam 5 = 39.4 s
      # (0.71x realtime — permanently falling behind), beam 1 = 26.2 s
      # (1.07x) for BYTE-IDENTICAL text. The beam buys nothing on this
      # audio and costs 50% more compute. asr-worker keeps beam 5: batch
      # has no realtime constraint.
      MD_ASR_BEAM_SIZE: "1"
      # Overlap stays at the 2 s default: it is the commit horizon, so
      # widening it would delay every commit and enlarge the tail that
      # finalize has to flush.
      MDX_WINDOW_OVERLAP_SECONDS: "2.0"
      MDX_WORKER_ID: dictation-dev-1
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/medical_dictation
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      MDX_TMPFS_ROOT: /run/dictation
      # Keep in sync with x-cors-env above — the SPA opens the WS from the
      # same origins it makes HTTP calls from.
      MDX_WS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:4173","http://127.0.0.1:4173","http://localhost:3000","https://vpu2301.github.io"]'
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ${HOME}/.cache/huggingface/hub/models--Systran--faster-whisper-large-v3:/opt/models/whisper-large-v3:ro
    tmpfs:
      # Owned by the nonroot service user (uid/gid 65532) so it can create
      # per-session 0700 dirs; RAM-backed so decrypted PCM never hits disk.
      - /run/dictation:size=2g,mode=0700,uid=65532,gid=65532
    ports:
      - "127.0.0.1:8002:8000"
    # NOT *svc-healthcheck: the shared 30 s start_period is sized for a
    # stateless FastAPI app. This container loads whisper large-v3 (int8,
    # CPU) AND warms ECAPA before it binds — measured 137–176 s on this
    # box. With start_period=30s the container reports UNHEALTHY for the
    # whole of a perfectly normal start, so `depends_on: service_healthy`
    # times out and a genuine crash-loop is indistinguishable from a
    # cold start. Warmup timings: docs/models/PINS.md.
    healthcheck:
      <<: *svc-healthcheck
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── nlp-service — 6-stage post-processing pipeline ────────────────
  nlp-service:
    build:
      context: .
      dockerfile: services/nlp-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_NLP_PUNCTUATION_DISABLED: "false"  # model is baked; needed for batch-transcript quality
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── report-service — templates + versioned reports + diff/FTS ─────
  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      # The sign surface (S09-rev) delegates envelope creation here.
      SIGNING_SERVICE_BASE_URL: http://signing-service:8000
      # "Assign transcription to patient" fetches the transcript here.
      ASR_SERVICE_BASE_URL: http://asr-service:8000
      # S12 notification producer — lifecycle transitions publish onto the
      # Redis Streams bus (ADR-0029). Without this the config default
      # (redis://localhost:6379/0) resolves to the container itself and
      # every publish silently no-ops, since publish_event never raises.
      REDIS_URL: redis://redis:6379/0
      # S15 audio replay (ADR-0037): decrypt-slice-encode needs the same
      # S3 + envelope-crypto wiring dictation-service has.
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/medical_dictation
      S3_ENDPOINT: http://minio:9000
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
    ports:
      - "127.0.0.1:8006:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # ── core-service — patients & the per-patient clinical record ─────
  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      # S11 privacy: DSAR export engine (see core_service/config.py).
      # DB_ERASURE_DSN is deliberately ABSENT — the erasure credential
      # lives only in the deploy/compose/privacy-ops.yml job containers
      # (ADR-0028); core-service never builds the erasure runtime.
      DB_CRYPTO_WRITER_DSN: postgresql://crypto_writer:crypto_writer@postgres:5432/medical_dictation
      DB_AUDIT_READER_DSN: postgresql://audit_reader:audit_reader@postgres:5432/medical_dictation
      DSAR_PACKAGE_TTL_DAYS: 7
      S3_ENDPOINT: http://minio:9000
      MDX_MASTER_KEY_PATH: /etc/mdx/master.key
      SIGNING_SERVICE_BASE_URL: http://signing-service:8000
      MDX_CONSENT_TEXTS_DIR: /etc/mdx/consents
    volumes:
      - ./infra/dev/master.key:/etc/mdx/master.key:ro
      - ./infra/seeds/consents:/etc/mdx/consents:ro
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── autocomplete-service — clinical phrase suggestions ────────────
  autocomplete-service:
    build:
      context: .
      dockerfile: services/autocomplete-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8007:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── llama-server — Layer C inference backend (S15, ADR-0036) ──────
  # Serves the pinned gemma3:1b GGUF (docs/models/PINS.md). The blob is
  # mounted from the host's Ollama store — run `ollama pull gemma3:1b`
  # ONCE on the host if it's missing. Containerized inference is
  # CPU-only (no Metal inside the Docker VM), hence the raised dev
  # timeout on generation-service below; the production bake + GPU
  # numbers are rig-gated (ADR-0036).
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "-m"
      - "/models/gemma3-1b.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--parallel"
      - "2"
      - "-c"
      - "4096"
    volumes:
      - ~/.ollama/models/blobs/sha256-7cd4618c1faf8b7233c6c906dac1694b6a47684b37b8895d470ac688520b9c01:/models/gemma3-1b.gguf:ro
    ports:
      - "127.0.0.1:8089:8080"

  # ── generation-service — Layer C inline completion (S15) ──────────
  generation-service:
    build:
      context: .
      dockerfile: services/generation-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_GEN_BACKEND: llamacpp
      MDX_GEN_BASE_URL: http://llama-server:8080
      MDX_GEN_MODEL: gemma3:1b
      # CPU-container inference (no Metal in the Docker VM) runs well
      # over the 600 ms production budget — dev keeps the feature usable
      # instead of answering 204 to everything (ADR-0036 dev posture).
      MDX_GEN_TIMEOUT_MS: "6000"
    ports:
      - "127.0.0.1:8009:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llama-server:
        # service_started, not healthy: the image ships no probe tool;
        # generation-service's own /readyz reflects backend readiness.
        condition: service_started

  # ── public-edge — the ONLY internet-facing surface (S09-rev) ──────
  # Reverse-proxy allowlist: exactly POST /signing/callbacks/diia,
  # GET /verify/* and POST /v1/completions/inline (S15 typing path,
  # per-IP edge cap below the app burst) pass through (TLS + edge rate
  # limit); every other path 404s at the edge. See
  # infra/edge/nginx.conf.template.
  # ── Mailpit — dev SMTP sink (S12) ─────────────────────────────────
  # Catches every outbound mail so nothing can escape a dev box, and
  # exposes an HTTP API the PHI gate asserts against. :8025 is the web
  # inbox used in the demo; :1025 is the SMTP port the service dials.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── notification-service — feed, WebSocket push, email (S12) ──────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      REDIS_URL: redis://redis:6379/0
      MDX_APP_BASE_URL: http://localhost:5173
      MDX_EMAIL_PROVIDER: smtp
      MDX_SMTP_HOST: mailpit
      MDX_SMTP_PORT: "1025"
      MDX_EMAIL_FROM: noreply@medical-dictation.local
      # Unique per replica — two replicas sharing a consumer name share
      # a pending-entries list.
      MDX_NOTIFICATION_CONSUMER_NAME: notification-1
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── marketing-service — public demo booking funnel (:8010) ────────
  #
  # No auth env and no Redis: it authenticates nobody and holds no
  # tenant data.
  #
  # MAIL TARGET IS A SWITCH, not a constant. Every SMTP/IMAP setting
  # below is `${VAR:-<mailpit default>}`, so with no `.env` present this
  # behaves exactly as before — mail is captured by Mailpit on :8025 and
  # reaches no real inbox. Drop a `.env` in this directory (gitignored)
  # with the sales@klarnote.com App Password and the same stack sends
  # for real and watches the mailbox for bookings.
  # See docs/runbooks/demo-booking.md.
  marketing-service:
    build:
      context: .
      dockerfile: services/marketing-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *postgres-dsns, *cors-env]
      MDX_EMAIL_PROVIDER: smtp
      MDX_MARKETING_SMTP_HOST: ${MDX_MARKETING_SMTP_HOST:-mailpit}
      MDX_MARKETING_SMTP_PORT: "${MDX_MARKETING_SMTP_PORT:-1025}"
      MDX_MARKETING_SMTP_USE_TLS: "${MDX_MARKETING_SMTP_USE_TLS:-false}"
      MDX_MARKETING_SMTP_USERNAME: ${MDX_MARKETING_SMTP_USERNAME:-}
      MDX_MARKETING_SMTP_PASSWORD: ${MDX_MARKETING_SMTP_PASSWORD:-}
      MDX_MARKETING_EMAIL_FROM: ${MDX_MARKETING_EMAIL_FROM:-sales@klarnote.com}
      MDX_MARKETING_EMAIL_FROM_NAME: Klarnote
      MDX_MARKETING_REPLY_TO: ${MDX_MARKETING_REPLY_TO:-sales@klarnote.com}
      # Booking watcher — needs the same App Password over IMAP. Off by
      # default; the service logs a WARNING at startup when it is off so
      # a missing confirmation can't be mistaken for a broken one.
      MDX_DEMO_WATCH_ENABLED: "${MDX_DEMO_WATCH_ENABLED:-false}"
      MDX_DEMO_IMAP_HOST: ${MDX_DEMO_IMAP_HOST:-imap.gmail.com}
      MDX_DEMO_IMAP_PORT: "${MDX_DEMO_IMAP_PORT:-993}"
      MDX_DEMO_IMAP_USERNAME: ${MDX_DEMO_IMAP_USERNAME:-}
      MDX_DEMO_IMAP_PASSWORD: ${MDX_DEMO_IMAP_PASSWORD:-}
      MDX_DEMO_BOOKING_URL: https://calendar.app.google/336HQrX67TV9UNJr8
      MDX_PUBLIC_BASE_URL: ${MDX_PUBLIC_BASE_URL:-http://localhost:5173}
      # Only turn this on once MDX_PUBLIC_BASE_URL actually SERVES
      # /unsubscribe over HTTPS. Claiming RFC 8058 one-click against a URL
      # that 404s — or a host with no certificate — gets the mail accepted
      # with a 250 and then dropped at the far end. Default off.
      MDX_MARKETING_UNSUBSCRIBE_ONE_CLICK: "${MDX_MARKETING_UNSUBSCRIBE_ONE_CLICK:-false}"
      MDX_DEMO_IP_HASH_SALT: ${MDX_DEMO_IP_HASH_SALT:-dev-marketing-salt}
    ports:
      - "127.0.0.1:8012:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  public-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SIGNING_UPSTREAM: signing-service:8000
      GENERATION_UPSTREAM: generation-service:8000
    volumes:
      - ./infra/edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/edge/certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
    depends_on:
      signing-service:
        condition: service_healthy
      generation-service:
        condition: service_healthy

  # ── signing-service — Ukrainian KEP e-signature + public /verify ──
  signing-service:
    build:
      context: .
      dockerfile: services/signing-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: [*common-env, *auth-env, *postgres-dsns, *cors-env]
      DB_PUBLIC_VERIFY_DSN: postgresql://app_public_verify:app_public_verify@postgres:5432/medical_dictation
      DB_CALLBACK_WRITER_DSN: postgresql://app_callback_writer:app_callback_writer@postgres:5432/medical_dictation
      REDIS_URL: redis://redis:6379/0
      TRUST_STORE_DIR: /etc/mdx/trust-store
      TRUST_STORE_INCLUDE_TEST_CA: "true"
      ENABLE_MOCK_PROVIDER: "true"
      # Dev-only password-confirmation signing scaffold (S09-rev). The
      # config model + provider + CI gate all refuse this in production.
      SIGNING_DEV_PASSWORD_ENABLED: "true"
    volumes:
      - ./infra/trust-store:/etc/mdx/trust-store:ro
    ports:
      - "127.0.0.1:8008:8000"
    healthcheck: *svc-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # `seed` (not just migrate): dev_role_logins.sql grants LOGIN to the
      # app_public_verify / app_callback_writer roles this service connects as.
      seed:
        condition: service_completed_successfully
