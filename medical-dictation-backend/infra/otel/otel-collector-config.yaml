receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Traces → Jaeger (OTLP gRPC). NOTE (Sprint A1, DEF-A1-22): must target
  # Jaeger's OTLP port 4317 (COLLECTOR_OTLP_ENABLED=true), NOT 14250 — 14250 is
  # Jaeger's native model.proto gRPC and rejects OTLP with "Unimplemented:
  # unknown service opentelemetry.proto.collector.trace.v1.TraceService".
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → Prometheus scrape endpoint.
  # NO namespace here: every dashboard and alert rule in the repo queries
  # the bare `mdx_*` names (mdx_ IS the app-level namespace). The former
  # `namespace: medical_dictation` silently prefixed every exported metric
  # and left ALL sprint dashboards/alerts querying nonexistent names
  # (found in the sprint-10 verification pass).
  #
  # add_metric_suffixes: false — same class of bug as the namespace above,
  # one layer down. The exporter otherwise appends the OTel *unit* to the
  # exported name: a unit="1" gauge becomes `..._ratio`, a unit="ms"
  # histogram becomes `..._milliseconds`, unit="MB" becomes `..._MB`. That
  # silently broke every rule/dashboard querying the instrument name as
  # declared in `metrics.py` ("Names match sprint-04 spec §9 verbatim").
  # Most just never fired; DictationConversationFleetUnavailable has an
  # `or vector(0)` fallback, so a NONEXISTENT metric name paged as "no
  # worker can take a conversation session" while the fleet was healthy.
  # Counters are already declared with a `_total` suffix in code, so
  # turning this off does not change their exported names.
  prometheus:
    endpoint: "0.0.0.0:8889"
    add_metric_suffixes: false

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true

  # Debug (stdout) — useful during local dev
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki, debug]
