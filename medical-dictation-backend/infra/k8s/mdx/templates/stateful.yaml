{{- /*
STAGING-ONLY in-cluster stateful stores (single replica + PVC).
Production sets stateful.inCluster=false and points the DSNs/hosts at
operator-managed stores (CloudNativePG, Redis operator, MinIO operator)
or managed services — docs/deploy/hosting-gap.md records the mapping.
*/ -}}
{{- if .Values.stateful.inCluster }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app: postgres, mdx-tier: stateful}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata:
      labels: {app: postgres, mdx-tier: stateful}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.stateful.postgres.image }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mdx-postgres, key: password}}
            - name: POSTGRES_DB
              value: medical_dictation
          ports: [{containerPort: 5432, name: pg}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 5
      volumes:
        - name: initdb
          configMap: {name: mdx-postgres-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.stateful.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: pg}]
---
# Role bootstrap — same init.sql the compose stack mounts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mdx-postgres-init
data:
  init.sql: |
{{ .Files.Get "files/postgres-init.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: redis, mdx-tier: stateful}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata:
      labels: {app: redis, mdx-tier: stateful}
    spec:
      containers:
        - name: redis
          image: {{ .Values.stateful.redis.image }}
          args: ["--appendonly", "yes"]
          ports: [{containerPort: 6379, name: redis}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: {app: minio, mdx-tier: stateful}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata:
      labels: {app: minio, mdx-tier: stateful}
    spec:
      containers:
        - name: minio
          image: {{ .Values.stateful.minio.image }}
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: mdx-minio, key: user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mdx-minio, key: password}}
          ports: [{containerPort: 9000, name: s3}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.stateful.minio.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports: [{port: 9000, targetPort: s3}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {app: keycloak, mdx-tier: stateful}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata:
      labels: {app: keycloak, mdx-tier: stateful}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.stateful.keycloak.image }}
          args: ["start-dev", "--import-realm", "--http-port=8080"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: mdx-keycloak-admin, key: user}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: mdx-keycloak-admin, key: password}}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            # init.sql creates the keycloak role + database (compose parity).
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: keycloak
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          # Staging: the dev realm export. Production: the realm import is
          # produced by scripts/k8s/gen-prod-realm.py — dev client secrets
          # REGENERATED, dev users absent (see values-prod + the gate).
          configMap: {name: mdx-keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports: [{port: 8080, targetPort: http}]
{{- if .Values.stateful.mailpit.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {app: mailpit, mdx-tier: stateful}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailpit}}
  template:
    metadata:
      labels: {app: mailpit, mdx-tier: stateful}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.stateful.mailpit.image }}
          ports:
            - {containerPort: 1025, name: smtp}
            - {containerPort: 8025, name: ui}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app: mailpit}
  ports:
    - {port: 1025, targetPort: smtp, name: smtp}
    - {port: 8025, targetPort: ui, name: ui}
{{- end }}
{{- end }}
