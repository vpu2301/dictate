{{- /*
Production secret sourcing — External Secrets Operator → Vault, the same
trust root as the ADR-0011 KMS choice. Staging does not render these
(scripts/k8s/staging-up.sh creates plain Secrets from dev material).

Vault KV layout (mount `secret`, path prefix .Values.externalSecrets.vaultPath):
  mdx/keycloak-clients : KEYCLOAK_LOGIN_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET
  mdx/master-key       : master.key (base64 of the 32-byte KEK — file
                         provider pods; Transit-mode pods need no key file)
  mdx/hmac-keys        : SIGNER_IPN_HMAC_KEY, PUBLIC_VERIFY_IP_HMAC_KEY,
                         IIT_CALLBACK_HMAC_KEY, MDX_PATIENT_IPN_HMAC_KEY,
                         DSAR_DOWNLOAD_TOKEN_HMAC_KEY
  mdx/infra            : postgres/minio/keycloak-admin credentials

Values are generated by scripts/k8s/gen-prod-secrets.py and written to
Vault by the operator — never through the repo.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.externalSecrets.secretStore }}
{{- $path := .Values.externalSecrets.vaultPath }}
{{- range $secret := list
      (dict "name" $.Values.secretRefs.keycloakClients "vault" "keycloak-clients")
      (dict "name" $.Values.secretRefs.masterKey       "vault" "master-key")
      (dict "name" $.Values.secretRefs.hmacKeys        "vault" "hmac-keys")
      (dict "name" "mdx-postgres"                      "vault" "infra")
      (dict "name" "mdx-minio"                         "vault" "infra")
      (dict "name" "mdx-keycloak-admin"                "vault" "infra") }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ $secret.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $path }}/{{ $secret.vault }}
{{- end }}
{{- end }}
