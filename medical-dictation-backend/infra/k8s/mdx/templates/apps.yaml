{{- /*
One Deployment (+ Service) per entry in .Values.apps. Special powers are
value-driven: gpu (node pool + toleration), tmpfs (per-pod RAM emptyDir),
drain (preStop hook + long grace), masterKey/consents mounts, workerId
(unique-per-pod env via the downward API), probes/service opt-outs for
queue consumers.
*/ -}}
{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "mdx.labels" $ | nindent 4 }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        mdx-tier: app
    spec:
      {{- if $app.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $app.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if $app.gpu }}
      # GPU pool: tainted gpu=true:NoSchedule; one worker per GPU via the
      # device plugin resource below.
      nodeSelector:
        mdx-pool: gpu
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # NO fsGroup — fsGroup forces group-read onto Secret mounts, which
        # turns the 0400 master key into 0440 and FileMasterKeyProvider
        # fails closed on it (found live in S16D staging).
      {{- if $app.masterKey }}
      initContainers:
        # Secret mounts can't produce a 65532-owned 0400 file (fsGroup
        # forces group-read → 0440, which FileMasterKeyProvider refuses;
        # no fsGroup leaves it root-owned and unreadable). A root init
        # copies the key into a private emptyDir with exactly the owner
        # and mode the provider's fail-closed check demands.
        - name: fix-master-key-perms
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - /bin/sh
            - -ec
            - |
              cp /secret-src/master.key /etc/mdx/master.key
              chown 65532:65532 /etc/mdx/master.key
              chmod 0400 /etc/mdx/master.key
          volumeMounts:
            - {name: master-key-src, mountPath: /secret-src, readOnly: true}
            - {name: master-key-dir, mountPath: /etc/mdx}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "mdx.image" (dict "root" $ "image" $app.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if or (not (hasKey $app "service")) $app.service }}
          ports:
            - containerPort: 8000
              name: http
          {{- end }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.global.otlpEndpoint | quote }}
            {{- range $k, $v := $.Values.commonEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if $app.workerId }}
            # Unique per pod — session resume + stream consumer identity.
            - name: {{ $app.workerIdEnv | default "MDX_WORKER_ID" }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          {{- if $app.secretEnv }}
          envFrom:
            {{- range $app.secretEnv }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if or (not (hasKey $app "probes")) $app.probes }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            # Model warmup can take minutes on cold pools; liveness above
            # answers immediately (sprint-16 backend MDX_WARM_IN_BACKGROUND).
            failureThreshold: 60
          {{- end }}
          {{- if $app.drain }}
          lifecycle:
            preStop:
              exec:
                # Scale-in drain: stop admitting, then hold the pod until
                # the last live session ends (cap = grace period). The
                # readiness flip pulls the pod from the Service so no new
                # connection can race in.
                command:
                  - python
                  - -c
                  - |
                    import json, time, urllib.request
                    urllib.request.urlopen(urllib.request.Request(
                        "http://127.0.0.1:8000/internal/drain", method="POST"), timeout=5)
                    while json.load(urllib.request.urlopen(
                            "http://127.0.0.1:8000/internal/drain", timeout=5))["active_sessions"] > 0:
                        time.sleep(5)
          {{- end }}
          resources:
            {{- toYaml ($app.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi"))) | nindent 12 }}
          volumeMounts:
            {{- if $app.tmpfs }}
            - name: session-tmpfs
              mountPath: {{ $app.tmpfs.path }}
            {{- end }}
            {{- if $app.masterKey }}
            - name: master-key-dir
              mountPath: /etc/mdx/master.key
              subPath: master.key
              readOnly: true
            {{- end }}
            {{- if $app.consents }}
            - name: consents
              mountPath: /etc/mdx/consents
              readOnly: true
            {{- end }}
            {{- if $app.trustStore }}
            - name: trust-store
              mountPath: /etc/mdx/trust-store
              readOnly: true
            {{- end }}
            {{- if $app.mockTestCa }}
            - name: mock-test-ca
              mountPath: /build/libs/kep/tests/fixtures/test-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if $app.tmpfs }}
        # §tmpfs-pressure: dedicated per-POD RAM-backed mount. sizeLimit is
        # enforced by the kubelet — one noisy pod can no longer starve its
        # neighbours' rings (the compose-era failure mode).
        - name: session-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: {{ $app.tmpfs.size }}
        {{- end }}
        {{- if $app.masterKey }}
        - name: master-key-src
          secret:
            secretName: {{ $.Values.secretRefs.masterKey }}
            defaultMode: 0400
        - name: master-key-dir
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if $app.consents }}
        - name: consents
          configMap:
            name: mdx-consent-texts
        {{- end }}
        {{- if $app.trustStore }}
        - name: trust-store
          configMap:
            name: mdx-trust-store
        {{- end }}
        {{- if $app.mockTestCa }}
        - name: mock-test-ca
          secret:
            secretName: mdx-mock-test-ca
        {{- end }}
{{- if or (not (hasKey $app "service")) $app.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "mdx.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: 8000
      targetPort: http
      name: http
{{- end }}
{{- end }}
