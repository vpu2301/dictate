[project]
name = "notification_events"
version = "0.1.0"
description = "Sprint-12 notification event envelope — the producer/consumer wire contract"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_events"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
