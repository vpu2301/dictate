[project]
name = "clinical_access"
version = "0.1.0"
description = "Treatment-relationship predicate — the single source of truth for whether a principal is on a patient's care"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_access"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
