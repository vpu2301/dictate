[project]
name = "evidence-retrieval"
version = "0.1.0"
description = "Hybrid dense+lexical retrieval with RRF fusion, reranking and the connector registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "opensearch-py[async]>=2.6",
    "evidence-models",
    "models",
    "db",
    "observability",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
