[project]
name = "evidence-answer"
version = "0.1.0"
description = "Quick Search question engine: triage, intent, staged pipeline, SSE streaming, provenance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    # Internal (workspace)
    "evidence-models",
    "evidence-safety",
    "models",
    # Platform libs (path deps via root tool.uv.sources)
    "db",
    "auth",
    "audit",
    "storage",
    "crypto",
    "secret",
    "observability",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under src/evidence_answer, prompts/
# included — hatchling packages the whole directory, not just .py files.
# A force-include of prompts/ on top of that adds each file a SECOND time at
# the same wheel path and hatchling refuses:
#   ValueError: A second file is being added to the wheel archive at the same
#   path: `evidence_answer/prompts/CHANGELOG.md`
# It went unnoticed because the service had only ever been installed editable
# (`uv run --project`), which never builds a wheel. The first real packaging —
# the Dockerfile — is what surfaced it.
packages = ["src/evidence_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
