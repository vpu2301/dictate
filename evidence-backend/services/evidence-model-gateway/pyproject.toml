[project]
name = "evidence-model-gateway"
version = "0.1.0"
description = "Role-addressed self-hosted model serving (embed.dense in v0; generators land on the rig)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sentence-transformers>=3.0",
    "observability",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_model_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
