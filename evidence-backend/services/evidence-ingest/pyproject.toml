[project]
name = "evidence-ingest"
version = "0.1.0"
description = "Evidence corpus ingestion: parse → chunk → enrich → dedup → embed → index → snapshot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "opensearch-py[async]>=2.6",
    # Parsers
    "pypdf>=4.2",
    "python-docx>=1.1",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    # Internal (workspace)
    "evidence-models",
    "evidence-safety",
    "models",
    # Platform libs (path deps via root tool.uv.sources)
    "db",
    "auth",
    "crypto",
    "audit",
    "storage",
    "secret",
    "observability",
    "messaging",
]

[project.scripts]
evidence-ingest = "evidence_ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
