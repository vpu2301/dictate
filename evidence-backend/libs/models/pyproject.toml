[project]
name = "models"
version = "0.1.0"
description = "Evidence model-gateway client — the ONLY sanctioned model access path (rule E12)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
