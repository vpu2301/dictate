[project]
name = "evidence-models"
version = "1.0.0"
description = "Evidence AI contracts v1 — leaf schema package (imports no other internal lib)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_models"]
