[project]
name = "evidence-safety"
version = "0.1.0"
description = "Content-safety screens shared by ingestion and the web agent (rule LM4)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]
